name: ci-cd

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  PYTHON_VERSION: "3.12"
  IMAGE_NAME: heart-disease-api

jobs:
  lint-test-train:
    name: Lint, test, train
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
          mkdir -p logs

      - name: Lint (ruff)
        run: ruff check . --output-format=github 2>&1 | tee logs/lint.log; exit ${PIPESTATUS[0]}
        shell: bash

      - name: Unit tests (pytest)
        shell: bash
        run: |
          pytest -v --junitxml=logs/junit.xml 2>&1 | tee logs/pytest.log
          exit ${PIPESTATUS[0]}

      - name: Prepare data (validate + clean; downloads if raw file absent)
        shell: bash
        run: python scripts/prepare_data.py 2>&1 | tee logs/prepare_data.log; exit ${PIPESTATUS[0]}

      - name: EDA figures
        shell: bash
        run: python scripts/run_eda.py 2>&1 | tee logs/eda.log; exit ${PIPESTATUS[0]}

      - name: Train + MLflow tracking + quality gate
        shell: bash
        run: python -m heartml.train 2>&1 | tee logs/train.log; exit ${PIPESTATUS[0]}

      - name: Inference check in a fresh process
        shell: bash
        run: python scripts/predict_sample.py 2>&1 | tee logs/predict_sample.log; exit ${PIPESTATUS[0]}

      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: model
          path: models/
          retention-days: 14

      - name: Upload reports, MLflow runs and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-mlruns-logs
          path: |
            logs/
            reports/
            mlruns/
            data/data_manifest.json
          retention-days: 14

  docker:
    name: Docker build, smoke test, push to GHCR
    needs: lint-test-train
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Download freshly trained model
        uses: actions/download-artifact@v4
        with:
          name: model
          path: models/

      - name: Build image
        run: docker build -t ${{ env.IMAGE_NAME }}:ci .

      - name: Run container
        run: docker run -d --name heart-api-ci -p 8000:8000 ${{ env.IMAGE_NAME }}:ci

      - name: Smoke test API in container
        shell: bash
        run: |
          mkdir -p logs
          bash scripts/smoke_test_api.sh http://localhost:8000 2>&1 | tee logs/smoke_test.log
          rc=${PIPESTATUS[0]}
          docker logs heart-api-ci > logs/container.log 2>&1
          exit $rc

      - name: Upload container logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-logs
          path: logs/

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE=ghcr.io/$OWNER/${{ env.IMAGE_NAME }}
          SHA=$(git rev-parse --short HEAD)
          docker tag ${{ env.IMAGE_NAME }}:ci $IMAGE:$SHA
          docker tag ${{ env.IMAGE_NAME }}:ci $IMAGE:latest
          docker push $IMAGE:$SHA
          docker push $IMAGE:latest
          echo "Pushed $IMAGE:$SHA and :latest" >> $GITHUB_STEP_SUMMARY
