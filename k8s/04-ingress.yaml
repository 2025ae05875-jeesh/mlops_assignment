# OPTIONAL: requires `minikube addons enable ingress`.
# Test with: curl -H "Host: heart-api.local" http://$(minikube ip)/health
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: heart-api-ingress
  namespace: heart-mlops
spec:
  ingressClassName: nginx
  rules:
    - host: heart-api.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: heart-api-svc
                port:
                  number: 80
